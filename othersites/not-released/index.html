<!DOCTYPE html>
<html lang="en">
<head>

  <title>DwayneTheDev's Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: rgba(255,255,255,0.05);

    h1 {

    }

    p {
      font-size: 18px;
      opacity: 0.85;
    }

    button {
      margin-top: 20px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #2f6bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1f4fc7;
    }
  </style>
</head>

  <div class="box">
    <h1>DwayneTheDev's Site</h1>
