<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DwayneTheDev's Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    button {
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #2b6fff;
      color: white;
      transition: 0.2s;
      width: 320px;
    }

    button:hover {
      background: #1f4fd1;
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <h1>DwayneTheDev's Site</h1>

  <button onclick="window.location.href='https://sites.google.com/view/dwaynethedev/projects?authuser=0'">

  </button>

</html>
